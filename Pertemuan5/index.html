<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List - Modul 5</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts untuk Tampilan Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>

        <!-- Fitur 1: Task Counter -->
        <div class="task-counter" id="taskCounter">
            <span>Total: <b>0</b></span>
            <span>Selesai: <b>0</b></span>
            <span>Belum: <b>0</b></span>
        </div>

        <!-- Form Input Tugas -->
        <form id="todoForm" novalidate>
            <div class="input-section">
                <input type="text" id="taskInput" placeholder="Ketikkan tugas baru Anda...">
                <button type="submit" class="add-btn">Tambah</button>
            </div>
            <div class="error-message" id="inputError">Tugas tidak boleh kosong atau kurang dari 3 karakter!</div>
        </form>

        <!-- Daftar Tugas -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- Fitur 2: Tombol Bersihkan Tugas Selesai -->
        <button id="clearCompletedBtn" class="clear-btn">Bersihkan Tugas Selesai</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

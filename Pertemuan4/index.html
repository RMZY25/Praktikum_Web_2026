<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Portofolio Proyek - Modul 4</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; 
        }
        
        body { 
            background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 35%, #ea580c 100%);
            background-attachment: fixed;
            color: #1e293b; 
            padding: 30px 15px;
            min-height: 100vh;
        }
        
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #ffffff; 
            border-radius: 16px; 
            padding: 30px; 
            box-shadow: 0 20px 40px -10px rgba(127, 29, 29, 0.45), 0 8px 16px -8px rgba(0, 0, 0, 0.15); 
            border-top: 6px solid transparent;
            border-image: linear-gradient(90deg, #b91c1c, #ea580c) 1;
        }
        
        h1 { 
            background: linear-gradient(90deg, #b91c1c, #ea580c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 28px; 
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }
        
        p.subtitle { 
            color: #64748b; 
            margin-bottom: 25px; 
            font-size: 14px; 
        }
        
        /* --- Gaya Form Input --- */
        .form-section {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }
        .form-section h2 {
            font-size: 16px;
            color: #334155;
            margin-bottom: 15px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #ea580c;
        }
        .form-group-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .form-group-checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .form-group-checkbox label {
            font-size: 14px;
            color: #334155;
            cursor: pointer;
        }
        .btn-submit {
            grid-column: span 2;
            padding: 12px;
            background: linear-gradient(135deg, #b91c1c, #ea580c);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }

        /* --- Gaya Pencarian --- */
        .search-box {
            margin-bottom: 20px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box input:focus {
            border-color: #ea580c;
            box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.1);
        }

        /* --- Gaya Statistik & Filter --- */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        
        .stat-card { 
            background: linear-gradient(135deg, #fef2f2 0%, #fff7ed 100%);
            border: 1px solid #fecaca; 
            border-radius: 12px; 
            padding: 18px; 
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px -4px rgba(234, 88, 12, 0.25);
        }
        
        .stat-card h3 { 
            font-size: 12px; 
            color: #9a3412; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            letter-spacing: 0.5px;
        }
        
        .stat-card p { 
            font-size: 22px; 
            font-weight: bold; 
            background: linear-gradient(90deg, #b91c1c, #ea580c);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .filter-group { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 20px; 
            flex-wrap: wrap; 
        }
        
        .btn-filter { 
            padding: 9px 18px; 
            border: 1px solid #fecaca; 
            background: #ffffff; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 600; 
            color: #9a3412;
            transition: all 0.25s ease; 
        }
        
        .btn-filter:hover { 
            background: linear-gradient(135deg, #dc2626, #ea580c);
            color: #ffffff; 
            border-color: transparent;
            box-shadow: 0 4px 10px -2px rgba(234, 88, 12, 0.4);
        }
        
        .btn-filter.active { 
            background: linear-gradient(135deg, #b91c1c, #ea580c);
            color: #ffffff; 
            border-color: transparent;
            box-shadow: 0 4px 12px -2px rgba(185, 28, 28, 0.45);
        }
        
        /* --- Gaya Kartu Proyek --- */
        .project-card { 
            border: 1px solid #fee2e2; 
            border-radius: 10px; 
            padding: 16px; 
            margin-bottom: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #ffffff; 
            transition: transform 0.15s ease, box-shadow 0.15s ease; 
            border-left: 4px solid #ea580c;
        }
        
        .project-card:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 12px rgba(234, 88, 12, 0.15); 
        }
        
        .project-info h4 { 
            font-size: 16px; 
            color: #1e293b; 
            margin-bottom: 4px; 
        }
        
        .project-category { 
            display: inline-block; 
            font-size: 11px; 
            color: #ffffff; 
            background: linear-gradient(135deg, #dc2626, #f97316);
            padding: 3px 10px; 
            border-radius: 6px; 
            margin-bottom: 6px; 
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        
        .project-budget { 
            font-size: 14px; 
            color: #9a3412; 
            font-weight: 600; 
        }
        
        .badge { 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 600; 
        }
        
        .badge-success { 
            background: #dcfce7; 
            color: #166534; 
        }
        
        .badge-pending { 
            background: #ffedd5; 
            color: #c2410c; 
        }

        /* --- Tombol Aksi Kartu --- */
        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
        }
        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-toggle {
            background: #e0f2fe;
            color: #0369a1;
        }
        .btn-toggle:hover {
            background: #bae6fd;
        }
        .btn-delete {
            background: #fee2e2;
            color: #b91c1c;
        }
        .btn-delete:hover {
            background: #fecaca;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .btn-submit {
                grid-column: span 1;
            }
            .project-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .card-actions {
                flex-direction: row;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Portofolio Proyek</h1>
        <p class="subtitle">Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM</p>

        <!-- Fitur 1: Formulir Input Proyek Dinamis -->
        <div class="form-section">
            <h2>Tambah Proyek Baru</h2>
            <form id="project-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="input-title">Judul Proyek</label>
                        <input type="text" id="input-title" placeholder="Contoh: Aplikasi Kasir" required>
                    </div>
                    <div class="form-group">
                        <label for="input-category">Kategori</label>
                        <select id="input-category" required>
                            <option value="" disabled selected>Pilih Kategori</option>
                            <option value="Web App">Web App</option>
                            <option value="Mobile App">Mobile App</option>
                            <option value="Desktop App">Desktop App</option>
                            <option value="UI/UX Design">UI/UX Design</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-budget">Estimasi Anggaran (Rp)</label>
                        <input type="number" id="input-budget" placeholder="Contoh: 5000000" min="1" required>
                    </div>
                    <div class="form-group-checkbox">
                        <input type="checkbox" id="input-completed">
                        <label for="input-completed">Sudah Selesai?</label>
                    </div>
                    <button type="submit" class="btn-submit">Tambah Proyek</button>
                </div>
            </form>
        </div>

        <!-- Kartu Ringkasan Statistik -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="stat-total-projects">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="stat-total-budget">Rp 0</p>
            </div>
            <div class="stat-card">
                <h3>Selesai Dikerjakan</h3>
                <p id="stat-completed-projects">0</p>
            </div>
        </div>

        <!-- Fitur 2: Pencarian Real-Time -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 Cari judul proyek...">
        </div>

        <!-- Tombol Filter Kategori -->
        <div class="filter-group">
            <button class="btn-filter active" data-category="Semua">Semua Proyek</button>
            <button class="btn-filter" data-category="Web App">Web App</button>
            <button class="btn-filter" data-category="Desktop App">Desktop App</button>
            <button class="btn-filter" data-category="Mobile App">Mobile App</button>
            <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
        </div>

        <!-- Kontainer Daftar Proyek -->
        <div id="project-list"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
